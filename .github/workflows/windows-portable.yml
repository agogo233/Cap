name: Windows Portable (x64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Build portable payload
    # windows-latest's newer SDK trips ffmpeg-sys-next 7.1.3 const asserts
    # (E0080) under rustc 1.88; windows-2022 is the image upstream's release
    # pipeline builds the same lockfile on.
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-release
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: |
            . -> target
            apps/desktop-gpui -> target

      - name: Allow long paths
        run: git config --global core.longpaths true

      - uses: ./.github/actions/setup-js

      - name: Create .env file in root
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "RUST_TARGET_TRIPLE=x86_64-pc-windows-msvc"
          } >> .env

      - name: Run cap-setup
        shell: bash
        run: bun run cap-setup
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      # The desktop-gpui workspace patches gpui to ../zed-cap, which only this
      # script materializes; without it the gpui patch cannot resolve.
      - name: Prepare gpui dependency
        shell: bash
        run: ./scripts/prepare-gpui-dependency.sh

      - name: Increase pagefile size
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 24GB
          disk-root: "D:"

      - name: Build desktop binaries
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: ./scripts/build-desktop-binaries.sh x86_64-pc-windows-msvc

      - name: Build Cap
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CI: false
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/bundle-gpui.mjs x86_64-pc-windows-msvc --no-bundle

      - name: Assemble portable payload
        id: assemble
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "x86_64-pc-windows-msvc"
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # First-party executables (same sources as windows-release-signing.ps1 Stage)
          Copy-Item "apps/desktop-gpui/target/$target/release/Cap.exe" $stage
          Copy-Item "apps/desktop-gpui/binaries/cap-cli-$target.exe" (Join-Path $stage "cap-cli.exe")
          Copy-Item "apps/desktop-gpui/binaries/cap-muxer-$target.exe" (Join-Path $stage "cap-muxer.exe")

          # Bundled DLLs: mirrors gpuiPlatformConfig("win32") in scripts/bundle-gpui.mjs
          Copy-Item "target/ffmpeg/bin/*.dll" $stage
          Copy-Item "target/native-deps/dxc/*.dll" $stage
          Copy-Item "target/native-deps/onnxruntime/lib/*.dll" $stage
          Copy-Item "target/native-deps/vcruntime/*.dll" $stage
          New-Item -ItemType Directory -Path "$stage/licenses/dxc" -Force | Out-Null
          Copy-Item "target/native-deps/dxc/LICENSE-*.txt" "$stage/licenses/dxc/"

          # Static resources declared in tauri.conf.json bundle.resources
          $config = Get-Content "apps/desktop-gpui/tauri.conf.json" -Raw | ConvertFrom-Json
          foreach ($property in $config.bundle.resources.PSObject.Properties) {
            $copied = Get-ChildItem -Path (Join-Path "apps/desktop-gpui" $property.Name) -File
            if (-not $copied) { throw "Resource pattern '$($property.Name)' matched no files." }
            $destDir = Join-Path $stage $property.Value
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            $copied | Copy-Item -Destination $destDir
          }

          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Verify portable payload
        shell: pwsh
        env:
          STAGE_PATH: ${{ steps.assemble.outputs.stage }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = $env:STAGE_PATH

          # Same required list as the "Verify Windows installer contents" gate in desktop-release.yml
          $required = @(
            "Cap.exe", "cap-muxer.exe", "cap-cli.exe",
            "avcodec-61.dll", "avdevice-61.dll", "avfilter-10.dll", "avformat-61.dll",
            "avutil-59.dll", "postproc-58.dll", "swresample-5.dll", "swscale-8.dll",
            "dxcompiler.dll", "dxil.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll",
            "msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $file) -PathType Leaf)) {
              throw "Portable payload is missing '$file'."
            }
          }

          foreach ($forbidden in @("cap-gpui.exe", "cap-exporter.exe")) {
            if (Test-Path -LiteralPath (Join-Path $stage $forbidden)) {
              throw "Portable payload unexpectedly bundles '$forbidden'."
            }
          }

          foreach ($dir in @(
            "assets/backgrounds/macOS", "assets/backgrounds/blue", "assets/backgrounds/cities",
            "assets/backgrounds/dark", "assets/backgrounds/orange", "assets/backgrounds/purple",
            "assets/music", "licenses/dxc", "licenses/nemotron-3-diarization", "licenses/wespeaker-campplus"
          )) {
            if (-not (Get-ChildItem -LiteralPath (Join-Path $stage $dir) -File -ErrorAction SilentlyContinue)) {
              throw "No files under '$dir'."
            }
          }

          $nested = @(Get-ChildItem -Path $stage -Recurse -File | Where-Object { $_.Extension -in @(".zip", ".7z", ".tar", ".gz", ".tgz") })
          if ($nested.Count -gt 0) {
            throw "Portable payload must not contain nested archives: $(($nested | ForEach-Object FullName) -join ', ')"
          }

          $count = (Get-ChildItem -Path $stage -Recurse -File).Count
          Write-Host "Portable payload verified: $count files."

      - name: Upload portable payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cap-windows-x64-portable
          path: ${{ steps.assemble.outputs.stage }}
          retention-days: 7
          if-no-files-found: error
